<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="50%" style="stop-color:#F7931E"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </linearGradient>
    <linearGradient id="palm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00C9A7"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="50%" style="stop-color:#0EA5E9"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="30%" style="stop-color:#F7931E"/>
      <stop offset="70%" style="stop-color:#00C9A7"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B35" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="128" x2="512" y2="128" stroke="white" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="white" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="white" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="white" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="white" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Sun -->
  <circle cx="380" cy="130" r="65" fill="url(#sun)" filter="url(#glow)" opacity="0.9"/>
  <circle cx="380" cy="130" r="50" fill="#FFD700" opacity="0.3"/>
  <circle cx="380" cy="130" r="35" fill="#FFF8DC" opacity="0.4"/>
  
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <line x1="380" y1="50" x2="380" y2="35"/>
    <line x1="440" y1="70" x2="450" y2="58"/>
    <line x1="460" y1="130" x2="478" y2="130"/>
    <line x1="440" y1="190" x2="450" y2="202"/>
    <line x1="380" y1="210" x2="380" y2="228"/>
    <line x1="320" y1="190" x2="310" y2="202"/>
    <line x1="300" y1="130" x2="282" y2="130"/>
    <line x1="320" y1="70" x2="310" y2="58"/>
  </g>
  
  <!-- Palm tree trunk -->
  <path d="M160 380 Q155 300 170 240 Q175 210 180 180" stroke="#8B6914" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M160 380 Q158 320 168 260 Q172 230 178 195" stroke="#A0522D" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Palm leaves -->
  <g fill="url(#palm)" filter="url(#shadow)">
    <path d="M178 180 Q120 120 60 100 Q100 130 140 150 Q160 160 178 180"/>
    <path d="M178 180 Q200 100 220 50 Q210 110 195 150 Q185 170 178 180"/>
    <path d="M178 180 Q250 130 300 120 Q260 145 220 160 Q195 170 178 180"/>
    <path d="M178 180 Q280 160 340 180 Q290 175 240 172 Q200 175 178 180"/>
    <path d="M178 180 Q100 200 50 230 Q90 210 130 195 Q160 185 178 180"/>
    <path d="M178 180 Q140 230 120 290 Q145 250 160 215 Q170 195 178 180"/>
  </g>
  
  <!-- Coconuts -->
  <circle cx="175" cy="185" r="8" fill="#8B4513"/>
  <circle cx="165" cy="190" r="7" fill="#A0522D"/>
  <circle cx="182" cy="192" r="6" fill="#8B4513"/>
  
  <!-- Waves -->
  <g fill="url(#wave)" opacity="0.6">
    <path d="M0 420 Q60 400 128 420 Q196 440 256 420 Q324 400 384 420 Q452 440 512 420 L512 512 L0 512 Z"/>
    <path d="M0 445 Q80 425 160 445 Q240 465 320 445 Q400 425 480 445 L512 445 L512 512 L0 512 Z" opacity="0.4"/>
    <path d="M0 470 Q100 455 200 470 Q300 485 400 470 Q480 458 512 470 L512 512 L0 512 Z" opacity="0.2"/>
  </g>
  
  <!-- V text -->
  <text x="256" y="340" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="160" fill="url(#textGrad)" filter="url(#glow)">V</text>
  
  <!-- Subtle highlight on V -->
  <text x="256" y="340" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="160" fill="white" opacity="0.05">V</text>
</svg>
